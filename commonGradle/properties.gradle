/**
 * 从 local.properties 文件中读取指定属性的值
 * @param propertyName 属性名称
 * @param defaultValue 默认值（可选）
 * @return 属性值或默认值
 */
def getLocalProperty(String propertyName, String defaultValue = null) {
    // 构建 local.properties 文件路径
    def propertiesFile = file('local.properties')

    // 检查文件是否存在
    if (propertiesFile.exists()) {
        // 加载属性文件
        Properties properties = new Properties()
        properties.load(new FileInputStream(propertiesFile))

        // 获取属性值
        def value = properties.getProperty(propertyName)
        if (value != null) {
            return value
        }
    }

    // 如果属性不存在或文件不存在，返回默认值
    return defaultValue
}

/**
 * 从 local.properties 文件中读取布尔类型属性的值
 * @param propertyName 属性名称
 * @param defaultValue 默认值（可选）
 * @return 布尔类型的属性值或默认值
 */
def getLocalPropertyBoolean(String propertyName, boolean defaultValue = false) {
    String value = getLocalProperty(propertyName)
    if (value != null) {
        return value.equalsIgnoreCase('true') || value == '1'
    }
    return defaultValue
}

/**
 * 从 local.properties 文件中读取整数类型属性的值
 * @param propertyName 属性名称
 * @param defaultValue 默认值（可选）
 * @return 整数类型的属性值或默认值
 */
def getLocalPropertyInt(String propertyName, int defaultValue = 0) {
    String value = getLocalProperty(propertyName)
    if (value != null) {
        try {
            return Integer.parseInt(value)
        } catch (NumberFormatException ignored) {
            // 解析失败，返回默认值
            return defaultValue
        }
    }
    return defaultValue
}

/**
 * 检查 local.properties 文件中是否存在指定属性
 * @param propertyName 属性名称
 * @return 如果属性存在则返回 true，否则返回 false
 */
def isExistLocalProperty(String propertyName) {
    return getLocalProperty(propertyName) != null
}


// 将方法添加到 extra 属性中，使其在其他脚本中可访问
extensions.extraProperties.setProperty('getLocalProperty', this.&getLocalProperty)
extensions.extraProperties.setProperty('getLocalPropertyBoolean', this.&getLocalPropertyBoolean)
extensions.extraProperties.setProperty('getLocalPropertyInt', this.&getLocalPropertyInt)
extensions.extraProperties.setProperty('isExistLocalProperty', this.&isExistLocalProperty)

// 同时添加到 gradle.ext 中，确保在所有模块中可访问
gradle.ext.getLocalProperty = this.&getLocalProperty
gradle.ext.getLocalPropertyBoolean = this.&getLocalPropertyBoolean
gradle.ext.getLocalPropertyInt = this.&getLocalPropertyInt
gradle.ext.isExistLocalProperty = this.&isExistLocalProperty