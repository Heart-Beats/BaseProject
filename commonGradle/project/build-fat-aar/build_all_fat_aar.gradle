def projectRelativeRootPath = './'

subprojects {
    Project project = it

    ext {
        // 定义当前模块名称
        module_name = project.path.takeBetween('-', '-')
    }

    project.afterEvaluate {
        if (project.plugins.hasPlugin('com.android.application')) {
            return
        }

        // module 打包 hook 脚本路径
        def moduleBuildScriptPath = rootProject.file(projectRelativeRootPath + './CommonGradle/project/build-fat-aar/module_build_aar.gradle').path
        project.apply from: moduleBuildScriptPath

        // fit-aar 打包 hook 脚本路径
       def fitAarHookFixScriptPath = rootProject.file(projectRelativeRootPath + '.' + '/CommonGradle/project/build-fat-aar/fit-aar_hook_fix.gradle').path
       project.apply from: fitAarHookFixScriptPath
    }
}



// 在项目依赖构建完成时，向根项目注册聚合任务：发布所有子模块
gradle.projectsEvaluated {
    // 在项目下创建的打包任务，
    //          任务	   速度	        执行的步骤	                          适用场景
    //    assembleRelease	慢	全流程构建 + lint + 测试 + 签名 + 混淆	正式发布前的完整检查
    //    bundleReleaseAar	快	只合并依赖 + 打包	                    日常开发调试、快速验证
    def buildAllTaskName = ['assembleRelease', 'bundleReleaseAar']

    buildAllTaskName.forEach { buildTaskName ->
        def publishAllName = buildTaskName.replace('Release', 'CombineAllRelease')

        // 在根项目下创建所有的发布任务
        rootProject.tasks.register("${publishAllName}") {
            group = "buildAar"
            description = "打包编译所有 combine 模块产物"

            dependsOn(rootProject.subprojects.findAll { isCombineModule(it) }
                    .collect { project ->
                        // 目前该插件不支持 local aar 发布，因此相关任务直接获取会失败
                        project.tasks.findByName(buildTaskName)?.doLast {
                            logger.lifecycle("✅ 模块 ${project.name} ${buildTaskName} 完成")
                        }
                    }.findAll { it != null })

            doLast {
                logger.lifecycle("✅ ${rootProject.name} 下的所有 combine 模块已打包编译完成")
            }
        }
    }
}