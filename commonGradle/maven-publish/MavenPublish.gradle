if (module_group == null || module_name == null) {
    throw new IllegalStateException("必须提供 module_group 和 moduleName!")
}

apply plugin: 'com.vanniktech.maven.publish'

apply plugin: 'signing'

if (rootProject.ext.isPublishRelease) {
    // ============================================================================
    // 凭证加载：优先级 local.properties > 环境变量 > Gradle 属性
    // ============================================================================
    def getSecret = { String key, String envKey = null ->
        // 1. 优先从 local.properties 读取
        File secretPropsFile = project.rootProject.file('local.properties')
        if (secretPropsFile.exists()) {
            Properties p = new Properties()
            p.load(new FileInputStream(secretPropsFile))
            if (p.containsKey(key)) return p.getProperty(key)
        }
        // 2. 从环境变量读取
        if (envKey != null) {
            def env = System.getenv(envKey)
            if (env != null) return env
        }
        // 3. 从 Gradle 属性读取（-P 或 gradle.properties）
        if (project.hasProperty(key)) return project.property(key)
        return null
    }

    signing {
        def signingKey = getSecret("signing.privateKey", "SIGNING_KEY")
        def signingPassword = getSecret("signing.password", "SIGNING_PASSWORD")

        if (signingKey != null && signingPassword != null) {
            // CI / 无 GPG 环境：使用 ASCII-armored 内存密钥签名（仅支持 RSA 密钥）
            useInMemoryPgpKeys(signingKey, signingPassword)
        } else {
            useGpgCmd() //使用 gpg-agent
        }
        sign publishing.publications
    }
}

mavenPublishing {

    // configure(new com.vanniktech.maven.publish.AndroidSingleVariantLibrary("release", true, true))

    publishToMavenCentral()

    // 配置 sourcesJar 与 javadocJar(参见：https://github.com/vanniktech/gradle-maven-publish-plugin/blob/main/plugin/src/main/kotlin/com/vanniktech/maven/publish/MavenPublishBaseExtension.kt#L430)
    //    configureBasedOnAppliedPlugins(true, com.vanniktech.maven.publish.tasks.JavadocJar.None())
    configureBasedOnAppliedPlugins(true, false)

    //    signAllPublications()

    def moduleGroup = module_group
    def moduleName = module_name
    def publishVersion = rootProject.ext.getPublicationVersion()


    println "maven 依赖坐标 --------->${moduleGroup}:${moduleName}:${publishVersion}"
    coordinates(moduleGroup, moduleName, publishVersion)

    pom {
        name = moduleName
        description = "Android 项目基础框架集成"
        url = "https://github.com/Heart-Beats/BaseProject"
        licenses {
            license {
                name = "The Apache License, Version 2.0"
                url = "https://github.com/Heart-Beats/BaseProject/blob/main/LICENSE.md"
                distribution = "http://www.apache.org/licenses/LICENSE-2.0.txt"
            }
        }
        developers {
            developer {
                id = "Heart-Beats"
                name = "Heart-Beats"
                url = "https://github.com/Heart-Beats"
            }
        }
        scm {
            url = "https://github.com/Heart-Beats/BaseProject"
            connection = "scm:git:git://github.com/Heart-Beats/BaseProject.git"
            developerConnection = "scm:git:ssh://git@github.com/Heart-Beats/BaseProject.git"
        }
    }
}